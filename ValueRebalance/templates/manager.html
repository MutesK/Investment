<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueRebalance Live Manager</title>
    <script src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            color: var(--primary);
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .summary-card p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .asset-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .asset-item.active {
            border-color: var(--accent);
            background: #eef7ff;
        }

        .asset-item h4 {
            margin: 0 0 5px 0;
        }

        .asset-item span {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .guide-box {
            background: #fff;
            border-left: 5px solid var(--accent);
            padding: 20px;
        }

        .action-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .badge-buy { background: #fee2e2; color: var(--danger); }
        .badge-sell { background: #dcfce7; color: var(--success); }
        .badge-wait { background: #f3f4f6; color: #6b7280; }

        .edit-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-success { background-color: var(--success); color: white; }

        .btn:hover { opacity: 0.9; }

        .cycle-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 VR Live Manager</h2>
        <div id="integrated-summary">
            <span id="total-krw">₩ 0</span> | <span id="total-usd">$ 0</span>
        </div>
    </div>

    <div class="container">
        <div class="summary-bar">
            <div class="card summary-card">
                <h3>선택 자산 평가금</h3>
                <p id="curr-eval">₩ 0</p>
            </div>
            <div class="card summary-card">
                <h3>V값 (목표 가이드)</h3>
                <p id="curr-v">₩ 0</p>
            </div>
            <div class="card summary-card">
                <h3>보유 현금 (Pool)</h3>
                <p id="curr-pool">₩ 0</p>
            </div>
        </div>

        <div class="asset-grid">
            <div class="asset-list" id="asset-list">
                <!-- 자산 리스트 동적 생성 -->
            </div>

            <div class="main-panel">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="card guide-box" id="buy-guide-box" style="border-left-color: var(--danger);">
                        <div class="action-badge badge-buy">BUY LOC</div>
                        <h3 id="buy-guide-text">0주 예약</h3>
                        <p id="buy-guide-detail" style="color: #666; font-size: 0.85rem;"></p>
                    </div>
                    <div class="card guide-box" id="sell-guide-box" style="border-left-color: var(--success);">
                        <div class="action-badge badge-sell">SELL LOC</div>
                        <h3 id="sell-guide-text">0주 예약</h3>
                        <p id="sell-guide-detail" style="color: #666; font-size: 0.85rem;"></p>
                    </div>
                </div>

                <div class="card">
                    <div class="cycle-info">
                        <div>
                            <strong>사이클 정보:</strong> <span id="cycle-num">1</span>회차 | 
                            <strong>시작일:</strong> <span id="cycle-start">2024-00-00</span>
                        </div>
                        <button class="btn btn-primary" onclick="updateCycle()">사이클 갱신</button>
                    </div>
                </div>

                <div class="card">
                    <h3>현재 자산 상태 편집</h3>
                    <div class="edit-form">
                        <div class="input-group">
                            <label>보유 주식 수</label>
                            <input type="number" id="input-shares" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>보유 현금 (₩)</label>
                            <input type="number" id="input-pool">
                        </div>
                        <div class="input-group">
                            <label>현재 V값 (₩)</label>
                            <input type="number" id="input-v">
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button class="btn btn-success" style="width: 100%;" onclick="saveState()">상태 저장</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>VR 전략 설정</h3>
                    <div class="edit-form">
                        <div class="input-group">
                            <label>운용 방식</label>
                            <select id="set-vr-type" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                                <option value="accumulation">적립식 (Accumulation)</option>
                                <option value="holding">거치식 (Holding)</option>
                                <option value="withdrawal">인출식 (Withdrawal)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>기울기 (G값)</label>
                            <input type="number" id="set-g" step="0.1">
                        </div>
                        <div class="input-group">
                            <label>매매 밴드 (±%)</label>
                            <input type="number" id="set-band" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>Pool 사용 비율 (0~1)</label>
                            <input type="number" id="set-pool-rate" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>월 적립/인출금 (₩)</label>
                            <input type="number" id="set-monthly">
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="saveSettings()">설정 저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAsset = null;
        let portfolioData = null;

        async function loadPortfolio() {
            const res = await fetch('/api/portfolio');
            const data = await res.json();
            portfolioData = data.portfolio;
            
            // 통합 요약 업데이트
            document.getElementById('total-krw').textContent = '₩ ' + data.summary.total_eval_krw.toLocaleString();
            document.getElementById('total-usd').textContent = '$ ' + data.summary.total_eval_usd.toLocaleString(undefined, {maximumFractionDigits:2});

            // 자산 리스트 업데이트
            const list = document.getElementById('asset-list');
            list.innerHTML = '';
            
            Object.keys(portfolioData.assets).forEach(name => {
                const asset = portfolioData.assets[name];
                const div = document.createElement('div');
                div.className = `asset-item ${currentAsset === name ? 'active' : ''}`;
                div.innerHTML = `
                    <h4>${name}</h4>
                    <span>${asset.ticker}</span>
                `;
                div.onclick = () => selectAsset(name);
                list.appendChild(div);
            });

            if (!currentAsset && Object.keys(portfolioData.assets).length > 0) {
                selectAsset(Object.keys(portfolioData.assets)[0]);
            } else if (currentAsset) {
                selectAsset(currentAsset);
            }
        }

        async function selectAsset(name) {
            currentAsset = name;
            const asset = portfolioData.assets[name];
            
            // 액티브 클래스 교체
            document.querySelectorAll('.asset-item').forEach(el => {
                el.classList.toggle('active', el.querySelector('h4').textContent === name);
            });

            // UI 업데이트
            document.getElementById('cycle-num').textContent = asset.state.cycle_num;
            document.getElementById('cycle-start').textContent = asset.state.start_date;
            document.getElementById('input-shares').value = asset.state.shares;
            document.getElementById('input-pool').value = asset.state.pool;
            document.getElementById('input-v').value = asset.state.v_value;

            // 설정값 UI 업데이트
            document.getElementById('set-vr-type').value = asset.settings.vr_type || 'accumulation';
            document.getElementById('set-g').value = asset.settings.g;
            document.getElementById('set-band').value = asset.settings.band_rate;
            document.getElementById('set-pool-rate').value = asset.settings.pool_usage_rate;
            document.getElementById('set-monthly').value = asset.settings.monthly_amount;

            // 가이드 로드
            const res = await fetch(`/api/asset/${name}/guide`);
            const guide = await res.json();
            
            updateGuideUI(guide);
        }

        function updateGuideUI(guide) {
            if (guide.error) {
                alert(guide.error);
                return;
            }

            document.getElementById('curr-eval').textContent = '₩ ' + guide.evaluation.toLocaleString(undefined, {maximumFractionDigits:0});
            document.getElementById('curr-v').textContent = '₩ ' + guide.v_value.toLocaleString(undefined, {maximumFractionDigits:0});
            document.getElementById('curr-pool').textContent = '₩ ' + portfolioData.assets[currentAsset].state.pool.toLocaleString(undefined, {maximumFractionDigits:0});

            // 매수 가이드
            document.getElementById('buy-guide-text').textContent = `${guide.buy_guide.quantity}주 매수 예약`;
            document.getElementById('buy-guide-detail').textContent = guide.buy_guide.description;

            // 매도 가이드
            document.getElementById('sell-guide-text').textContent = `${guide.sell_guide.quantity}주 매도 예약`;
            document.getElementById('sell-guide-detail').textContent = guide.sell_guide.description;
        }

        async function saveState() {
            const data = {
                name: currentAsset,
                shares: parseFloat(document.getElementById('input-shares').value),
                pool: parseFloat(document.getElementById('input-pool').value),
                v_value: parseFloat(document.getElementById('input-v').value)
            };

            const res = await fetch('/api/asset/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('성공적으로 저장되었습니다.');
                loadPortfolio();
            }
        }

        async function saveSettings() {
            const data = {
                name: currentAsset,
                vr_type: document.getElementById('set-vr-type').value,
                g: parseFloat(document.getElementById('set-g').value),
                band_rate: parseFloat(document.getElementById('set-band').value),
                pool_usage_rate: parseFloat(document.getElementById('set-pool-rate').value),
                monthly_amount: parseFloat(document.getElementById('set-monthly').value)
            };

            const res = await fetch('/api/asset/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('전략 설정이 저장되었습니다.');
                loadPortfolio();
            }
        }

        function updateCycle() {
            alert('사이클 갱신 로직은 구현 예정입니다.');
        }

        window.onload = loadPortfolio;
    </script>
</body>
</html>
