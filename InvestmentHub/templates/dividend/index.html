{% extends 'base.html' %}

{% block title %}Dividend Planner{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-8">
    <div class="bg-dark-card border border-dark-border p-8 rounded-3xl shadow-xl">
        <h2 class="text-2xl font-bold mb-6">Compare Dividend Stocks</h2>
        <div class="flex gap-4 mb-8">
            <input id="tickerInput" type="text" placeholder="Add Ticker (e.g. SCHD)" class="flex-1 bg-dark-bg border border-dark-border rounded-xl px-6 py-3 focus:outline-none focus:border-blue-500 font-medium">
            <button onclick="addTicker()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-8 rounded-xl transition-all">Add</button>
        </div>

        <div id="tickerList" class="flex flex-wrap gap-2 mb-8">
            <!-- List of tickers -->
            <span class="px-4 py-2 bg-blue-500/10 text-blue-500 rounded-xl border border-blue-500/20 font-bold flex items-center gap-2">
                SCHD <button onclick="this.parentElement.remove()" class="hover:text-white">×</button>
            </span>
            <span class="px-4 py-2 bg-blue-500/10 text-blue-500 rounded-xl border border-blue-500/20 font-bold flex items-center gap-2">
                DGRO <button onclick="this.parentElement.remove()" class="hover:text-white">×</button>
            </span>
        </div>

        <button onclick="runDividendAnalysis()" id="runBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
            <i data-lucide="calculator"></i>
            Run Analysis
        </button>
    </div>

    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Result cards will be injected here -->
    </div>
</div>

<script>
    function addTicker() {
        const input = document.getElementById('tickerInput');
        const val = input.value.toUpperCase().trim();
        if (!val) return;
        
        const list = document.getElementById('tickerList');
        const span = document.createElement('span');
        span.className = 'px-4 py-2 bg-blue-500/10 text-blue-500 rounded-xl border border-blue-500/20 font-bold flex items-center gap-2';
        span.innerHTML = `${val} <button onclick="this.parentElement.remove()" class="hover:text-white">×</button>`;
        list.appendChild(span);
        input.value = '';
    }

    async function runDividendAnalysis() {
        const tickers = Array.from(document.querySelectorAll('#tickerList span')).map(s => s.innerText.split(' ')[0]);
        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        btn.innerText = 'Analyzing...';

        try {
            const response = await fetch('/dividend/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tickers })
            });
            const data = await response.json();
            
            let html = '';
            for (const [ticker, info] of Object.entries(data)) {
                html += `
                <div class="bg-dark-card border border-dark-border p-8 rounded-3xl hover:border-blue-500/50 transition-all">
                    <h3 class="text-3xl font-black mb-4">${ticker}</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between border-b border-dark-border/50 pb-2">
                            <span class="text-slate-400">Current Yield</span>
                            <span class="font-bold text-green-500">${info.yield}%</span>
                        </div>
                        <div class="flex justify-between border-b border-dark-border/50 pb-2">
                            <span class="text-slate-400">3Y Div Growth</span>
                            <span class="font-bold text-blue-500">${info.growth_3y}%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Annual Payout</span>
                            <span class="font-bold">$${info.latest_annual}</span>
                        </div>
                    </div>
                </div>`;
            }
            document.getElementById('resultsGrid').innerHTML = html;
        } catch (e) {
            alert('Analysis failed');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="calculator"></i> Run Analysis`;
            lucide.createIcons();
        }
    }
</script>
{% endblock %}
