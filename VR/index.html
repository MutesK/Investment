<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Rebalancing Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #070913;
            --bg-surface: #0f1225;
            --bg-card: rgba(20, 24, 48, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.15);
            --accent: #4facfe;
            
            --success: #39ff14;
            --success-glow: rgba(57, 255, 20, 0.15);
            --danger: #ff0844;
            --danger-glow: rgba(255, 8, 68, 0.15);
            
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        header {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(15, 18, 37, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 16px var(--primary); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: var(--primary-glow);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-container {
            flex: 1;
            padding: 24px;
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Cards styles */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            background-color: rgba(7, 9, 19, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        button {
            cursor: pointer;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: var(--font-sans);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: #070913;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Simulation Controls */
        .simulation-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
        }

        /* Metrics Row */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        /* Charts panel */
        .chart-card {
            flex: 1;
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Cycle Navigation Timeline */
        .timeline-container {
            margin-bottom: 20px;
        }

        .timeline-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 0;
        }

        .timeline-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .timeline-pill.active {
            background: var(--primary-glow);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .timeline-pill:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        /* Detail display row */
        .cycle-meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .meta-item {
            display: flex;
            gap: 8px;
        }

        .meta-label {
            color: var(--text-muted);
        }

        .meta-value {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Tables */
        .tables-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .table-wrapper {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .table-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buy-header {
            background: linear-gradient(90deg, rgba(57, 255, 20, 0.08), transparent);
            border-bottom: 1px solid rgba(57, 255, 20, 0.2);
            color: var(--success);
        }

        .sell-header {
            background: linear-gradient(90deg, rgba(255, 8, 68, 0.08), transparent);
            border-bottom: 1px solid rgba(255, 8, 68, 0.2);
            color: var(--danger);
        }

        .table-scroll {
            max-height: 250px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        th {
            padding: 10px 16px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: var(--font-mono);
            color: var(--text-dim);
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-buy {
            background: var(--success-glow);
            color: var(--success);
            border: 1px solid rgba(57, 255, 20, 0.3);
        }

        .badge-sell {
            background: var(--danger-glow);
            color: var(--danger);
            border: 1px solid rgba(255, 8, 68, 0.3);
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .animate-row {
            animation: tableRowFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes tableRowFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric-value-updated {
            animation: valueGlow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes valueGlow {
            0% {
                text-shadow: 0 0 15px var(--primary);
                color: #ffffff;
                transform: scale(1.02);
            }
            100% {
                text-shadow: none;
                transform: scale(1);
            }
        }
        
        .metric-value {
            transition: color 0.3s ease, transform 0.2s ease;
            display: inline-block;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title-container">
            <div class="logo-dot"></div>
            <h1>Value Rebalancing Dashboard</h1>
        </div>
        <div class="status-badge">
            <span class="logo-dot" style="width:8px; height:8px; animation:none;"></span>
            <span>Simulator Active</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Left Column: Inputs and Simulation Control -->
        <div class="glass-card">
            <div class="card-title">설정 및 시뮬레이터</div>
            <form id="param-form" onsubmit="event.preventDefault();">
                <div class="form-row">
                    <div class="form-group">
                        <label for="ticker">종목코드 (Ticker)</label>
                        <input type="text" id="ticker" value="TQQQ">
                    </div>
                    <div class="form-group">
                        <label for="name">종목명</label>
                        <input type="text" id="name" value="Nasdaq 3x">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="init-count">초기 수량 (Count)</label>
                        <input type="number" id="init-count" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="init-price">초기 주가 (Price)</label>
                        <input type="number" id="init-price" value="1500" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="init-pool">초기 예수금 (Pool)</label>
                        <input type="number" id="init-pool" value="1000" min="0">
                    </div>
                    <div class="form-group">
                        <label for="extra">사이클 적립금 (Extra)</label>
                        <input type="number" id="extra" value="200" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="buy-unit">매수 단위 (Buy Unit)</label>
                        <input type="number" id="buy-unit" value="2" min="1">
                    </div>
                    <div class="form-group">
                        <label for="sell-unit">매도 단위 (Sell Unit)</label>
                        <input type="number" id="sell-unit" value="3" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="band-ratio">밴드 비율 (Band Ratio)</label>
                        <input type="number" id="band-ratio" value="0.15" step="0.01" min="0" max="1">
                    </div>
                    <div class="form-group">
                        <label for="pool-limit">최대 매수 비중 (Limit)</label>
                        <input type="number" id="pool-limit" value="0.75" step="0.01" min="0" max="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="param-g">기울기 G</label>
                        <input type="number" id="param-g" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label for="start-date">시작일</label>
                        <input type="date" id="start-date" value="2026-06-01">
                    </div>
                </div>

                <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="initSimulation()">초기화 및 실행</button>
            </form>

            <div class="simulation-box">
                <div style="font-size: 13px; font-weight:600; margin-bottom: 10px; color:var(--text-main);">사이클 시뮬레이션</div>
                <div class="form-group">
                    <label for="next-price">다음 사이클 평가 가격 (Price)</label>
                    <input type="number" id="next-price" value="1500" min="1">
                </div>
                <div class="form-row">
                    <button class="btn-secondary" onclick="simulateRandomPrice()">무작위 주가</button>
                    <button class="btn-primary" onclick="advanceCycle()">사이클 진행</button>
                </div>
            </div>
        </div>

        <!-- Middle Column: Chart, Navigation, Metrics -->
        <div style="display:flex; flex-direction:column;">
            <!-- Metrics Row -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">총 자산 가치</span>
                    <span class="metric-value" id="val-total" style="color: var(--primary);">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">주식 가치 (보유 개수)</span>
                    <span class="metric-value" id="val-stock" style="color: var(--text-main);">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">예수금 (Pool)</span>
                    <span class="metric-value" id="val-pool" style="color: var(--text-dim);">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">누적 수익률 (ROI)</span>
                    <span class="metric-value" id="val-roi">0.00%</span>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="glass-card chart-card">
                <div class="card-title">Value Rebalancing 밴드 추이</div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Timeline Navigation -->
            <div class="timeline-container">
                <div style="font-size: 12px; color:var(--text-muted); font-weight:600; margin-bottom: 8px;">사이클 히스토리 이동</div>
                <div class="timeline-scroll" id="timeline-scroll">
                    <!-- timeline pills go here -->
                </div>
            </div>

            <!-- Cycle Meta Info Detail -->
            <div class="cycle-meta-info" id="cycle-meta-info">
                <!-- meta details go here -->
            </div>
        </div>

        <!-- Right Column: Trading Tables -->
        <div class="glass-card">
            <div class="card-title">거래 예약 테이블 (Trading Tables)</div>
            <div class="tables-container">
                <!-- Buy Trading Table -->
                <div class="table-wrapper">
                    <div class="table-header buy-header">
                        <span>매수 예약 테이블 (Buy Table)</span>
                        <span class="badge badge-buy">추가 매수</span>
                    </div>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>목표 수량</th>
                                    <th>예약 단가</th>
                                    <th>예수금 잔액</th>
                                </tr>
                            </thead>
                            <tbody id="buy-table-body">
                                <!-- rows go here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Sell Trading Table -->
                <div class="table-wrapper">
                    <div class="table-header sell-header">
                        <span>매도 예약 테이블 (Sell Table)</span>
                        <span class="badge badge-sell">분할 매도</span>
                    </div>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>목표 수량</th>
                                    <th>예약 단가</th>
                                    <th>예수금 잔액</th>
                                </tr>
                            </thead>
                            <tbody id="sell-table-body">
                                <!-- rows go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Structures matching Python
        class Calculator {
            static CalculateV(V_before, Pool, G, E, extra) {
                return V_before + Pool / G + (E - V_before) / 2 * Math.sqrt(G) + extra;
            }
        }

        class Cycle {
            constructor() {
                this.start_time = "";
                this.end_time = "";
                this.cycle_count = 0;
                this.eval_start = 0;
                this.eval_end = 0;
                this.current_v = 0;
                this.mininum_band = 0;
                this.maximum_band = 0;
                this.pool_start = 0;
                this.pool_end = 0;
                this.buy_trading_tables = [];
                this.sell_trading_tables = [];
            }
        }

        class Asset {
            constructor(code, name, count, evaluation, P, extra, startDateStr, buy_unit, sell_unit, bandRatio, poolLimit, g) {
                this.ticker = code;
                this.name = name;
                this.count = count;
                this.extra = extra;
                this.buy_unit = buy_unit;
                this.sell_unit = sell_unit;
                this.bandRatio = bandRatio;
                this.poolLimit = poolLimit;
                this.g = g;
                this.cycles = [];

                // Determine Monday start date
                let start_dt;
                if (!startDateStr) {
                    let today = new Date();
                    let day = today.getDay();
                    let diff = today.getDate() - day + (day === 0 ? -6 : 1); // adjust when day is sunday
                    start_dt = new Date(today.setDate(diff));
                } else {
                    start_dt = new Date(startDateStr);
                    let day = start_dt.getDay();
                    let diff = start_dt.getDate() - day + (day === 0 ? -6 : 1);
                    start_dt = new Date(start_dt.setDate(diff));
                }

                let cycle1 = new Cycle();
                cycle1.cycle_count = 1;
                cycle1.start_time = this.formatDate(start_dt);
                cycle1.end_time = this.formatDate(this.addDays(start_dt, 14));
                cycle1.eval_start = evaluation;
                cycle1.current_v = evaluation;
                cycle1.mininum_band = evaluation * (1 - this.bandRatio);
                cycle1.maximum_band = evaluation * (1 + this.bandRatio);
                cycle1.pool_start = P;
                cycle1.pool_end = 0;
                cycle1.buy_trading_tables = this.CalculrateBuyTable(cycle1);
                cycle1.sell_trading_tables = this.CalculrateSellTable(cycle1);

                this.cycles.push(cycle1);
            }

            formatDate(d) {
                let month = '' + (d.getMonth() + 1),
                    day = '' + d.getDate(),
                    year = d.getFullYear();
                if (month.length < 2) month = '0' + month;
                if (day.length < 2) day = '0' + day;
                return [year, month, day].join('-');
            }

            addDays(date, days) {
                let result = new Date(date);
                result.setDate(result.getDate() + days);
                return result;
            }

            CalculrateCycle(eval_end) {
                let before_cycle = this.cycles[this.cycles.length - 1];
                let new_cycle = new Cycle();

                before_cycle.eval_end = eval_end;

                new_cycle.cycle_count = before_cycle.cycle_count + 1;
                new_cycle.eval_start = before_cycle.eval_end;

                // Date logic
                if (before_cycle.end_time) {
                    let start_dt = new Date(before_cycle.end_time);
                    new_cycle.start_time = before_cycle.end_time;
                    new_cycle.end_time = this.formatDate(this.addDays(start_dt, 14));
                }

                new_cycle.current_v = Calculator.CalculateV(
                    before_cycle.current_v,
                    before_cycle.pool_end,
                    this.g,
                    before_cycle.eval_end,
                    this.extra
                );

                new_cycle.mininum_band = new_cycle.current_v * (1 - this.bandRatio);
                new_cycle.maximum_band = new_cycle.current_v * (1 + this.bandRatio);
                new_cycle.pool_start = before_cycle.pool_end + this.extra;

                new_cycle.buy_trading_tables = this.CalculrateBuyTable(new_cycle);
                new_cycle.sell_trading_tables = this.CalculrateSellTable(new_cycle);

                this.cycles.push(new_cycle);
            }

            CalculrateBuyTable(cycle) {
                let mininum_band = cycle.mininum_band;
                let count = this.count;
                let pool = cycle.pool_start;
                let max_usage = pool * this.poolLimit;
                let usage = 0;

                let buy_trading_tables = [];

                if (count <= 0 || mininum_band <= 0 || max_usage <= 0) {
                    return buy_trading_tables;
                }

                while (true) {
                    let trading_point = mininum_band / count;
                    let next_cost = trading_point * this.buy_unit;
                    if (usage + next_cost > max_usage) {
                        break;
                    }
                    usage += next_cost;
                    buy_trading_tables.push({
                        Type: 'BUY',
                        AssetCount: count + this.buy_unit,
                        TradingPoint: trading_point,
                        PoolStat: Math.floor(pool - usage)
                    });
                    count += this.buy_unit;
                }

                return buy_trading_tables;
            }

            CalculrateSellTable(cycle) {
                let maximum_band = cycle.maximum_band;
                let count = this.count;
                let pool = cycle.pool_start;

                let sell_trading_tables = [];

                if (count <= 1 || maximum_band <= 0) {
                    return sell_trading_tables;
                }

                let received_cash = 0;
                for (let i = this.sell_unit; i < count; i += this.sell_unit) {
                    let trading_point = maximum_band / i;
                    let transaction_income = this.sell_unit * trading_point;
                    received_cash += transaction_income;
                    sell_trading_tables.push({
                        Type: 'SELL',
                        AssetCount: count - i,
                        TradingPoint: trading_point,
                        PoolStat: Math.floor(pool + received_cash)
                    });
                }

                return sell_trading_tables;
            }
        }

        // Global Simulation State
        let activeAsset = null;
        let chartInstance = null;
        let currentViewingCycleIdx = 0;

        function initSimulation() {
            const container = document.querySelector('.main-container');
            if (container) {
                container.style.opacity = '0.3';
                container.style.transition = 'opacity 0.15s ease';
            }
            
            // Clear tables immediately so there is no leftover data visible
            document.getElementById("buy-table-body").innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">초기화 중...</td></tr>`;
            document.getElementById("sell-table-body").innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">초기화 중...</td></tr>`;

            setTimeout(() => {
                let ticker = document.getElementById("ticker").value;
                let name = document.getElementById("name").value;
                let count = parseInt(document.getElementById("init-count").value);
                let price = parseInt(document.getElementById("init-price").value);
                let pool = parseInt(document.getElementById("init-pool").value);
                let extra = parseInt(document.getElementById("extra").value);
                let buyUnit = parseInt(document.getElementById("buy-unit").value);
                let sellUnit = parseInt(document.getElementById("sell-unit").value);
                let bandRatio = parseFloat(document.getElementById("band-ratio").value);
                let poolLimit = parseFloat(document.getElementById("pool-limit").value);
                let g = parseFloat(document.getElementById("param-g").value);
                let startDate = document.getElementById("start-date").value;

                activeAsset = new Asset(ticker, name, count, price, pool, extra, startDate, buyUnit, sellUnit, bandRatio, poolLimit, g);
                currentViewingCycleIdx = 0;

                updateDashboard();
                
                if (container) {
                    container.style.opacity = '1';
                }
            }, 150);
        }

        function advanceCycle() {
            if (!activeAsset) return;

            let nextPrice = parseInt(document.getElementById("next-price").value);
            let currentCycle = activeAsset.cycles[activeAsset.cycles.length - 1];

            let pool_end = currentCycle.pool_start;
            if (nextPrice <= currentCycle.mininum_band && currentCycle.buy_trading_tables.length > 0) {
                pool_end = currentCycle.buy_trading_tables[0].PoolStat;
                activeAsset.count = currentCycle.buy_trading_tables[0].AssetCount;
            } else if (nextPrice >= currentCycle.maximum_band && currentCycle.sell_trading_tables.length > 0) {
                pool_end = currentCycle.sell_trading_tables[0].PoolStat;
                activeAsset.count = currentCycle.sell_trading_tables[0].AssetCount;
            }
            currentCycle.pool_end = pool_end;

            activeAsset.CalculrateCycle(nextPrice);
            currentViewingCycleIdx = activeAsset.cycles.length - 1;

            document.getElementById("next-price").value = nextPrice;

            updateDashboard();
        }

        function simulateRandomPrice() {
            if (!activeAsset) return;
            let currentCycle = activeAsset.cycles[activeAsset.cycles.length - 1];
            let base = currentCycle.current_v;
            let factor = 0.85 + Math.random() * 0.3; // 0.85 to 1.15
            document.getElementById("next-price").value = Math.round(base * factor);
        }

        function updateMetric(id, value) {
            let el = document.getElementById(id);
            if (el && el.innerText !== value) {
                el.innerText = value;
                el.classList.remove("metric-value-updated");
                void el.offsetWidth; // force reflow
                el.classList.add("metric-value-updated");
            }
        }

        function updateDashboard() {
            if (!activeAsset) return;

            // Update Timeline Pills
            let timelineScroll = document.getElementById("timeline-scroll");
            timelineScroll.innerHTML = "";
            activeAsset.cycles.forEach((cycle, idx) => {
                let pill = document.createElement("div");
                pill.className = `timeline-pill ${idx === currentViewingCycleIdx ? 'active' : ''}`;
                pill.innerText = `Cycle ${cycle.cycle_count}`;
                pill.onclick = () => {
                    currentViewingCycleIdx = idx;
                    updateDashboard();
                };
                timelineScroll.appendChild(pill);
            });

            // Update selected cycle details
            let selectedCycle = activeAsset.cycles[currentViewingCycleIdx];
            let metaInfo = document.getElementById("cycle-meta-info");
            metaInfo.innerHTML = `
                <div class="meta-item"><span class="meta-label">사이클 기간:</span><span class="meta-value">${selectedCycle.start_time} ~ ${selectedCycle.end_time}</span></div>
                <div class="meta-item"><span class="meta-label">시작 주가:</span><span class="meta-value">${numberWithCommas(selectedCycle.eval_start)}원</span></div>
                <div class="meta-item"><span class="meta-label">종료 주가:</span><span class="meta-value">${selectedCycle.eval_end ? numberWithCommas(selectedCycle.eval_end) + '원' : '진행중'}</span></div>
                <div class="meta-item"><span class="meta-label">기준 V값:</span><span class="meta-value">${Math.round(selectedCycle.current_v)}</span></div>
                <div class="meta-item"><span class="meta-label">하한선 (Min):</span><span class="meta-value">${Math.round(selectedCycle.mininum_band)}원</span></div>
                <div class="meta-item"><span class="meta-label">상한선 (Max):</span><span class="meta-value">${Math.round(selectedCycle.maximum_band)}원</span></div>
            `;

            // Update Tables with stagger animation
            let buyBody = document.getElementById("buy-table-body");
            buyBody.innerHTML = "";
            if (selectedCycle.buy_trading_tables.length === 0) {
                buyBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">예약된 거래 없음</td></tr>`;
            } else {
                selectedCycle.buy_trading_tables.forEach((row, idx) => {
                    let tr = document.createElement("tr");
                    tr.className = "animate-row";
                    tr.style.animationDelay = `${idx * 40}ms`;
                    tr.innerHTML = `
                        <td>${row.AssetCount}개</td>
                        <td>${numberWithCommas(Math.round(row.TradingPoint))}원</td>
                        <td>${numberWithCommas(row.PoolStat)}원</td>
                    `;
                    buyBody.appendChild(tr);
                });
            }

            let sellBody = document.getElementById("sell-table-body");
            sellBody.innerHTML = "";
            if (selectedCycle.sell_trading_tables.length === 0) {
                sellBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">예약된 거래 없음</td></tr>`;
            } else {
                selectedCycle.sell_trading_tables.forEach((row, idx) => {
                    let tr = document.createElement("tr");
                    tr.className = "animate-row";
                    tr.style.animationDelay = `${idx * 40}ms`;
                    tr.innerHTML = `
                        <td>${row.AssetCount}개</td>
                        <td>${numberWithCommas(Math.round(row.TradingPoint))}원</td>
                        <td>${numberWithCommas(row.PoolStat)}원</td>
                    `;
                    sellBody.appendChild(tr);
                });
            }

            // Update Metrics Card (using active cycle context)
            let latestCycle = activeAsset.cycles[activeAsset.cycles.length - 1];
            let activePrice = latestCycle.eval_start;
            let stockValue = activeAsset.count * activePrice;
            let poolValue = latestCycle.pool_start;
            let totalValue = stockValue + poolValue;

            // Calculate ROI relative to initial inputs
            let initCount = parseInt(document.getElementById("init-count").value);
            let initPrice = parseInt(document.getElementById("init-price").value);
            let initPool = parseInt(document.getElementById("init-pool").value);
            let totalInitial = (initCount * initPrice) + initPool;
            let totalExtraAdded = (activeAsset.cycles.length - 1) * activeAsset.extra;
            let netProfit = totalValue - (totalInitial + totalExtraAdded);
            let roi = (netProfit / (totalInitial + totalExtraAdded)) * 100;

            updateMetric("val-total", numberWithCommas(Math.round(totalValue)) + "원");
            updateMetric("val-stock", `${numberWithCommas(Math.round(stockValue))}원 (${activeAsset.count}개)`);
            updateMetric("val-pool", numberWithCommas(Math.round(poolValue)) + "원");
            
            let roiEl = document.getElementById("val-roi");
            if (roiEl) {
                let roiText = (roi >= 0 ? "+" : "") + roi.toFixed(2) + "%";
                if (roiEl.innerText !== roiText) {
                    roiEl.innerText = roiText;
                    roiEl.style.color = roi >= 0 ? "var(--success)" : "var(--danger)";
                    roiEl.classList.remove("metric-value-updated");
                    void roiEl.offsetWidth; // force reflow
                    roiEl.classList.add("metric-value-updated");
                }
            }

            // Update Chart
            updateChart();
        }

        function updateChart() {
            let labels = [];
            let vData = [];
            let minData = [];
            let maxData = [];
            let priceData = [];

            activeAsset.cycles.forEach(cycle => {
                labels.push(`C${cycle.cycle_count}`);
                vData.push(cycle.current_v);
                minData.push(cycle.mininum_band);
                maxData.push(cycle.maximum_band);
                // For the last cycle, price is not set yet, so we don't display it or display start price
                if (cycle.cycle_count < activeAsset.cycles.length) {
                    priceData.push(cycle.eval_end);
                } else {
                    priceData.push(null);
                }
            });

            if (chartInstance) {
                chartInstance.destroy();
            }

            let ctx = document.getElementById('mainChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '실제 종가 (Price)',
                            data: priceData,
                            borderColor: '#ffffff',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            pointBackgroundColor: '#ffffff',
                            pointRadius: 4,
                            tension: 0.1
                        },
                        {
                            label: '기준 V값',
                            data: vData,
                            borderColor: '#4facfe',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            label: '상한 밴드 (Max)',
                            data: maxData,
                            borderColor: '#ff0844',
                            backgroundColor: 'rgba(255, 8, 68, 0.03)',
                            fill: '+1',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            label: '하한 밴드 (Min)',
                            data: minData,
                            borderColor: '#39ff14',
                            backgroundColor: 'transparent',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#94a3b8',
                                font: {
                                    family: 'Outfit'
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.03)'
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: {
                                    family: 'Outfit'
                                }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.03)'
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: {
                                    family: 'JetBrains Mono'
                                },
                                callback: function(value) {
                                    return numberWithCommas(value) + '원';
                                }
                            }
                        }
                    }
                }
            });
        }

        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Initialize simulation on load
        window.onload = () => {
            // Set current date
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("start-date").value = today;
            initSimulation();
        };
    </script>
</body>
